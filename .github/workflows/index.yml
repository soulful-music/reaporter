name: index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: No global read or write outside the allowlist (luac)
        run: lua5.4 tests/run.lua test_globals
      - run: lua5.4 tests/run.lua

  index:
    needs: test
    if: github.event_name == 'push'
    # Pinned: rugged links the distro's libgit2 (1.7 on 24.04); bundled libgit2 fails to build.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: sudo apt-get update && sudo apt-get install -y pandoc libgit2-dev pkg-config
      - run: gem install rugged -v 1.7.2 -- --use-system-libraries
      - run: gem install reapack-index
      - name: Update index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reapack-index --commit --warnings
          # Another push may have landed meanwhile: rebase onto it, once.
          git push || { git pull --rebase origin main && git push; }
